name: Port BUSSID Mod Editor to Android

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # ---------- Persiapan runner (cegah OOM / disk penuh) ----------
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL || true
          df -h /

      - name: Add 8G swap
        run: |
          sudo swapoff -a || true
          sudo fallocate -l 8G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h

      # ---------- Langkah pipeline milikmu ----------
      # >>> GANTI blok ini dengan langkah ASLI di workflow-mu untuk menaruh
      # >>> folder game Windows ke ./game  (download/unzip dari mana pun sumbernya).
      - name: Get game files
        run: |
          echo "TODO: isi dengan langkah asli (hasil akhir: folder ./game)"
          test -d game

      # >>> GANTI dengan langkah ASLI yang mengunduh AssetRipper ke ./ar
      - name: Get AssetRipper
        run: |
          echo "TODO: isi dengan langkah asli (hasil akhir: folder ./ar)"
          test -d ar

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reconstruct Unity project
        run: python3 port.py reconstruct game ar project

      # >>> Jika langkah asli build native memakai argumen/toolchain lain, pakai yang asli.
      - name: Build native libs (etcwrap)
        run: bash build_native.sh   # hasilnya harus ada di ./native-out

      - name: Patch project
        run: python3 port.py patch project native-out

      # ---------- Build Unity ----------
      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: project/Library
          key: Library-Android-${{ hashFiles('project/ProjectSettings/ProjectVersion.txt') }}-${{ github.run_number }}
          restore-keys: |
            Library-Android-${{ hashFiles('project/ProjectSettings/ProjectVersion.txt') }}-
            Library-Android-

      - name: Build Android
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: project
          unityVersion: 2021.3.8f1
          targetPlatform: Android
          androidExportType: androidPackage
          androidSymbolType: none
          buildMethod: AndroidPortBuild.Build
          buildName: BUSSIDModEditor
          versioning: Semantic
          allowDirtyBuild: true
          # Untuk tes tanpa IL2CPP: -stackTraceLogType Full -portBackend mono
          customParameters: -stackTraceLogType Full

      # ---------- Hasil ----------
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BUSSIDModEditor-Android
          path: build/Android
          if-no-files-found: error

      - name: Upload port report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: port-report
          path: |
            port-report.txt
            port-snippets.txt
            project/Logs
          if-no-files-found: ignore
